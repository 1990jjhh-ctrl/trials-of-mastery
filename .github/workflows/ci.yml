# Checks every pull request and every push to main with the same scripts a
# developer runs (CONTRIBUTING.md#ci), including the cross build of the plugin
# DLLs and the runtime-import check (scripts/build.sh), and the unit tests
# under ASan and UBSan (the core-asan preset). The toolchain comes from the
# setup action of lib/skyrim-mod-toolchain.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run for its older head, so
# force-pushes don't queue up full cross builds. Every other run gets its own
# group (the run ID), so runs on main are never cancelled or queued behind
# each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    name: Commit messages (gitlint)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The version the commit-msg hook runs locally.
      - run: pip install gitlint==0.19.1
      - name: Lint the pull request's commits
        run: gitlint --commits "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  checks:
    name: Format, tests, lint and cross build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up the cross-compile toolchain
        uses: ./lib/skyrim-mod-toolchain/.github/actions/setup
        with:
          native-tests: "true"

      - name: scripts/test.sh
        run: scripts/test.sh

      - name: Formatting (format.sh --check)
        run: lib/skyrim-mod-toolchain/scripts/format.sh --check modules

      - name: Lint (lint.sh)
        run: lib/skyrim-mod-toolchain/scripts/lint.sh build/core modules

      - name: scripts/build.sh
        run: scripts/build.sh

  # A separate job, so it runs alongside checks instead of lengthening it. The
  # default c++ of ubuntu-24.04 is GCC 13, which lacks P2718R0, so it catches
  # dangling temporaries in range-for that newer GCC hides.
  sanitizers:
    name: Unit tests (ASan, UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up the cross-compile toolchain
        uses: ./lib/skyrim-mod-toolchain/.github/actions/setup
        with:
          native-tests: "true"

      - name: cmake --workflow --preset core-asan
        run: cmake --workflow --preset core-asan
