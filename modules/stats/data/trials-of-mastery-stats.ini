; Trials of Mastery: Stats settings.
; A key that is left out, or set to a value that is not valid, keeps the
; default shown here; a value that is not valid is also written to the log.

[Progression]
; r: each trained point of a stat costs 100 * r^k XP, with k the points
; trained since the stat last advanced. Must be greater than 1.
CostGrowth = 2

; N: without a module that claims advancing, all stats advance (their cost
; resets to 100) whenever the player's level is a multiple of N.
AdvanceInterval = 5

; Free stat points granted at every level-up.
FreePointsPerLevelUp = 3

[StatBox]
; The key that opens the stat box while the skills menu is open, as a
; DirectX scan code (37 is K).
Key = 37

; The gamepad button for the same, as an SKSE gamepad code from 266 to 281
; (279 is Y).
GamepadButton = 279

; The most lines of text on one stat box page, group names and the empty
; lines between groups included; longer text is split into pages. At least 2.
; The default is a placeholder until it is measured in game.
LinesPerPage = 15

[Compatibility]
; The module disables itself when it detects an incompatible mod. Set this to
; true to run anyway, unsupported.
; TODO(OQ-8): whether the module only warns or disables itself is still open.
AllowIncompatibleMods = false
